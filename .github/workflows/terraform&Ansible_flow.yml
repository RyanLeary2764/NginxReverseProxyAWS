# .github/workflows/terraform.yml
name: Terraform CI/CD

on:
  push:
    branches: [ TestingBranch ]
  pull_request:
    branches: [ TestingBranch ]

jobs:
  terraform:
    name: Provision Infrastructure
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Generate SSH key pair
      id: ssh
      run: |
        mkdir -p ~/.ssh
        ssh-keygen -t ed25519 -f ~/.ssh/id_ed25519 -q -N ""
        chmod 600 ~/.ssh/id_ed25519
        echo "PRIVATE_KEY_PATH=$HOME/.ssh/id_ed25519" >> $GITHUB_ENV
        echo "PUBLIC_KEY=$(cat ~/.ssh/id_ed25519.pub)" >> $GITHUB_ENV

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.6.6

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1 

    - name: Terraform Init
      run: terraform init
      working-directory: Terraform

    - name: Terraform Validate
      run: terraform validate
      working-directory: Terraform

    - name: Terraform Plan
      run: terraform plan -var="public_key=${{env.PUBLIC_KEY}}"
      working-directory: Terraform

    - name: Terraform Apply
      if: github.ref == 'refs/heads/TestingBranch' && github.event_name == 'push'
      run: |
        terraform apply -auto-approve -var="public_key=${{env.PUBLIC_KEY}}"
      working-directory: Terraform

    - name: Save EC2 IP
      run: |
        echo "EC2_IP=$(terraform output -raw NginxAWS_server_public_ip)" >> $GITHUB_ENV
      working-directory: Terraform

    - name: Debug EC2 IP
      run: echo "EC2 IP from Terraform output is $EC2_IP"

    - name: Debug repo structure
      run: ls -R

    - name: Install Ansible
      run: sudo apt-get update && sudo apt-get install -y ansible

    - name: Generate Inventory 
      run: |
        echo "[ephemeral]" > inventory.ini
        echo "${{ env.EC2_IP }} ansible_user=ubuntu ansible_ssh_private_key_file=${{ env.PRIVATE_KEY_PATH}}" >> inventory.ini
    - name: Debug Inventory
      run: |
        pwd
        ls -l inventory.ini
        cat inventory.ini

    - name: Run Ansible Playbook
      uses: dawidd6/action-ansible-playbook@v2
      with:
        playbook: ansible/playbook.yml
        inventory: ${{ github.workspace }}/inventory.ini
      env:
        PRIVATE_KEY_PATH: ${{ env.PRIVATE_KEY_PATH }}
        EC2_IP: ${{ env.EC2_IP }}
